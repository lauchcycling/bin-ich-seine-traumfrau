<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ist Samina Alex' Traumfrau?</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    main {
      width: 100%;
      max-width: 640px;
      padding: 2.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 2.5rem;
    }

    .question {
      font-size: clamp(2.2rem, 7vw, 4rem);
      font-weight: 850;
      letter-spacing: -0.035em;
      line-height: 1.15;
      color: #000000;
      word-break: break-word;
      text-wrap: balance;
    }

    .action-container {
      position: relative;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .reveal-btn {
      appearance: none;
      border: none;
      outline: none;
      background-color: #000000;
      color: #ffffff;
      font-size: clamp(1.1rem, 3.5vw, 1.35rem);
      font-weight: 600;
      letter-spacing: -0.01em;
      padding: 1rem 2.5rem;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12), 0 2px 6px rgba(0, 0, 0, 0.08);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), 
                  box-shadow 0.25s ease, 
                  opacity 0.3s ease, 
                  background-color 0.2s ease;
      user-select: none;
    }

    .reveal-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18), 0 3px 8px rgba(0, 0, 0, 0.12);
    }

    .reveal-btn:active {
      transform: scale(0.97);
    }

    .reveal-btn.hidden {
      opacity: 0;
      transform: scale(0.8);
      pointer-events: none;
      position: absolute;
    }

    .answer {
      display: none;
      font-size: clamp(4.5rem, 18vw, 8rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1;
      color: #000000;
      user-select: none;
    }

    .answer.revealed {
      display: inline-block;
      animation: revealPop 0.85s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes revealPop {
      0% {
        opacity: 0;
        transform: scale(0.2) translateY(20px) rotate(-6deg);
        filter: blur(10px);
      }
      50% {
        opacity: 1;
        filter: blur(0px);
      }
      75% {
        transform: scale(1.15) translateY(-6px) rotate(2deg);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0) rotate(0deg);
        filter: blur(0px);
      }
    }

    /* Respektiert Benutzerpräferenz für reduzierte Bewegung */
    @media (prefers-reduced-motion: reduce) {
      .reveal-btn, .answer {
        transition: opacity 0.2s ease !important;
        animation: none !important;
      }
      .answer.revealed {
        opacity: 1 !important;
        transform: none !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1 class="question">Ist Samina Alex' Traumfrau?</h1>

    <div class="action-container" aria-live="polite">
      <button id="revealBtn" class="reveal-btn" type="button" aria-expanded="false">
        Nachschauen
      </button>

      <div id="answer" class="answer" aria-hidden="true">
        Ja!
      </div>
    </div>
  </main>

  <script>
    const revealBtn = document.getElementById('revealBtn');
    const answer = document.getElementById('answer');

    revealBtn.addEventListener('click', () => {
      revealBtn.classList.add('hidden');
      revealBtn.setAttribute('aria-expanded', 'true');

      answer.classList.add('revealed');
      answer.setAttribute('aria-hidden', 'false');
    });
  </script>
</body>
</html>
